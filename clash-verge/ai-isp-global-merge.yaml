# ==============================================================================
# Clash Verge Rev / Mihomo Party 全局扩展覆写配置 (脱敏模板)
# 用法：订阅 (Profiles) -> 全局扩展覆写配置 (Merge) -> 右键编辑粘贴，替换 <YOUR_ISP_*> 占位符
# ==============================================================================

profile:
  store-selected: true

# 专属全局纯净端口 17899（供纯净 Chrome 专窗直连静态 ISP，杜绝分流多出口不一致）
listeners:
  - name: pure-static-isp
    type: mixed
    port: 17899
    listen: 127.0.0.1
    udp: true
    proxy: "🇺🇸 独享静态ISP"

prepend-proxies:
  - name: "🇺🇸 独享静态ISP"
    type: socks5                  # 若商家提供 HTTP 代理则改为 http
    server: "<YOUR_ISP_IP>"
    port: 1080                    # 改为你的 ISP 端口
    username: "<YOUR_ISP_USER>"
    password: "<YOUR_ISP_PASS>"
    udp: true
    dialer-proxy: "ISP-自动跳板"

prepend-proxy-groups:
  # 面板顶部分组：默认走独享静态 ISP；尚未填入 ISP 前可临时切到「ISP-自动跳板」
  - name: "AI-ISP"
    type: select
    proxies:
      - "🇺🇸 独享静态ISP"
      - "ISP-自动跳板"

  # 自动抓取你当前任意机场订阅中延迟最低的节点当加密前置跳板（港/日/新/美均可，排除自身防死循环）
  - name: "ISP-自动跳板"
    type: url-test
    include-all: true
    # 若想限定只用港日美节点当跳板，可取消下面这行注释：
    # filter: "(?i)HK|香港|JP|日本|SG|新加坡|US|USA|美国"
    exclude-filter: "(?i)独享静态ISP|DIRECT|REJECT|剩余|到期|官网|套餐|重置|群组"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

# 防 DNS 泄漏：国内域名走国内 DNS，其余海外与 AI 域名全部穿过 AI-ISP 在远端加密解析
dns:
  ipv6: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query#AI-ISP
    - https://8.8.8.8/dns-query#AI-ISP

prepend-rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve

