# ==============================================================================
# Clash Verge Rev / Mihomo Party 全局扩展覆写配置 (脱敏模板)
# 用法：订阅 (Profiles) -> 全局扩展覆写配置 (Merge) -> 右键编辑粘贴，替换 <YOUR_ISP_*> 占位符
# ==============================================================================

profile:
  store-selected: true

# 专属全局纯净端口 17899（供纯净 Chrome/Edge 专窗直连静态 ISP，杜绝分流多出口不一致）
listeners:
  - name: pure-static-isp
    type: mixed
    port: 17899
    listen: 127.0.0.1
    udp: true
    proxy: "AI-ISP"

# 可选：跨订阅双层兜底节点（主力订阅高速池 + 备用 HY2 订阅 + 静态 ISP 失效兜底节点）
# 若只需要单订阅，可直接删除或保持注释整段 proxy-providers
# proxy-providers:
#   BACKUP-FAST:
#     type: http
#     url: "<YOUR_BACKUP_SUB_URL>"
#     path: ./proxy_providers/backup_fast.yaml
#     interval: 86400
#     filter: '^(HK - 香港专线|TW - 台湾专线|US - 圣何塞)$'
#   BACKUP-FALLBACK:
#     type: http
#     url: "<YOUR_BACKUP_SUB_URL>"
#     path: ./proxy_providers/backup_fast.yaml
#     interval: 86400
#     filter: '^US - 洛杉矶$'
#   BACKUP-HY2:
#     type: http
#     url: "<YOUR_SECOND_BACKUP_SUB_URL>"
#     path: ./proxy_providers/backup_hy2.yaml
#     interval: 86400
#     filter: '(?i)HY2|Hysteria'

prepend-proxies:
  - name: "🇺🇸 独享静态ISP"
    type: socks5                  # 若商家提供 HTTP 代理则改为 http
    server: "<YOUR_ISP_IP>"
    port: 1080                    # 改为你的 ISP 端口
    username: "<YOUR_ISP_USER>"
    password: "<YOUR_ISP_PASS>"
    udp: true
    dialer-proxy: "ISP-自动跳板"

prepend-proxy-groups:
  # 严格优先走独享静态 ISP；若启用了上面的 BACKUP-FALLBACK，在静态 ISP 不可用时自动故障转移过去，恢复后自动切回
  - name: "AI-ISP"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 30
    lazy: false
    proxies:
      - "🇺🇸 独享静态ISP"
    # use:
    #   - BACKUP-FALLBACK

  # 两级冗余跳板：优先使用主跳板池；若启用多订阅，可在主力池全挂时自动降级到备用 HY2 池
  - name: "ISP-自动跳板"
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 60
    lazy: false
    proxies:
      - "ISP-主力高速池"
      # - "ISP-HY备用池"

  # 第一层主力跳板池：自动抓取高速稳定节点（排除静态 ISP 本身与低速家宽/低倍率节点防瓶颈）
  - name: "ISP-主力高速池"
    type: url-test
    include-all: true
    # use:
    #   - BACKUP-FAST
    # 若想限定只用指定高速节点（注意 filter 会同时作用于 include-all 与 use），可取消下面注释：
    # filter: '(?i)(HK|香港|JP|日本|SG|新加坡|US|圣何塞|硅谷|TW|台湾)'
    exclude-filter: '(?i)独享静态ISP|家宽|0\.3X|DIRECT|REJECT|剩余|到期|官网|套餐|重置|群组'
    url: https://www.gstatic.com/generate_204
    interval: 180
    tolerance: 50

  # 可选第二层备用跳板池（配合上面的 BACKUP-HY2 provider 取消注释使用）
  # - name: "ISP-HY备用池"
  #   type: url-test
  #   use:
  #     - BACKUP-HY2
  #   url: https://www.gstatic.com/generate_204
  #   interval: 300
  #   tolerance: 50

# 防 DNS 泄漏：国内域名走国内 DNS，其余海外与 AI 域名全部穿过 AI-ISP 在远端加密解析
dns:
  ipv6: false
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query#AI-ISP
    - https://8.8.8.8/dns-query#AI-ISP

prepend-rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve

